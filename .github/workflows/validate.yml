name: Validar sintaxe e testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Checar sintaxe do JavaScript embutido em index.html
        run: node scripts/check-syntax.js

  testes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Testes do motor De-Para Signus (inclui golden da amostra Mega Nexus)
        run: npm test
